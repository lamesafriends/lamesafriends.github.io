<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="apple-touch-icon" href="../../images/apple-touch-icon.png">
    <title>Reimbursement Request Generator | Friends of the La Mesa Library</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
            color: #333;
        }

        .site-logo {
            display: block;
            max-width: 240px;
            width: 100%;
            height: auto;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 28px 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 16px;
            color: #666;
            margin: 0 0 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .field .req {
            color: #d32f2f;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .row .field {
            flex: 1;
            min-width: 180px;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            font-size: 15px;
            margin-bottom: 0;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            width: auto;
            margin: 0;
        }

        #otherAccountWrap,
        #mailWrap {
            margin-top: 12px;
        }

        .hidden {
            display: none !important;
        }

        .amount-wrap {
            position: relative;
        }

        .amount-wrap span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 15px;
        }

        .amount-wrap input {
            padding-left: 26px;
        }

        .drop-zone {
            border: 3px dashed #ccc;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: #fff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover {
            border-color: #999;
            background-color: #fafafa;
        }

        .drop-zone:focus-visible {
            outline: none;
            border-color: #2196F3;
            background-color: #e3f2fd;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        .drop-zone.drag-over {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }

        .drop-icon {
            font-size: 40px;
            margin-bottom: 14px;
        }

        .drop-text {
            font-size: 17px;
            color: #666;
            margin-bottom: 8px;
        }

        .drop-hint {
            font-size: 13px;
            color: #999;
        }

        .file-input {
            display: none;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
        }

        .file-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
            background-color: #fafafa;
        }

        .file-list .fname {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-list .fmeta {
            color: #999;
            font-size: 12px;
            white-space: nowrap;
        }

        .file-list .remove {
            border: none;
            background: none;
            color: #d32f2f;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .generate-btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .generate-btn:hover {
            background-color: #43a047;
        }

        .generate-btn:disabled {
            background-color: #a5d6a7;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.info {
            background-color: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #bbdefb;
        }

        .status-message ul {
            margin: 8px 0 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Friends of the La Mesa Library" class="site-logo">
    <h1>Reimbursement Request Generator</h1>
    <p class="subtitle">Fill out the form, attach your receipts, and download a single PDF to submit to the treasurer.</p>

    <form id="reimbForm" novalidate>
        <div class="card">
            <h2>Request Details</h2>

            <div class="row">
                <div class="field">
                    <label for="requestedBy">Requested By <span class="req">*</span></label>
                    <input type="text" id="requestedBy" name="requestedBy" autocomplete="name" placeholder="First Last">
                </div>
                <div class="field">
                    <label for="date">Date <span class="req">*</span></label>
                    <input type="date" id="date" name="date">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="amount">Amount <span class="req">*</span></label>
                    <div class="amount-wrap">
                        <span>$</span>
                        <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="0.00">
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Budget Account <span class="req">*</span></label>
                <div class="radio-group">
                    <label><input type="radio" name="budget" value="Adults"> Adults</label>
                    <label><input type="radio" name="budget" value="Bookstore"> Bookstore</label>
                    <label><input type="radio" name="budget" value="Children"> Children</label>
                    <label><input type="radio" name="budget" value="Library Support"> Library Support</label>
                    <label><input type="radio" name="budget" value="Teens"> Teens</label>
                    <label><input type="radio" name="budget" value="Other"> Other</label>
                </div>
                <div id="otherAccountWrap" class="hidden">
                    <input type="text" id="otherAccount" name="otherAccount" placeholder="Specify other account">
                </div>
            </div>

            <div class="field">
                <label for="treasurerNote">Note to treasurer <span style="font-weight:normal;color:#777;">(optional)</span></label>
                <textarea id="treasurerNote" name="treasurerNote"></textarea>
            </div>
        </div>

        <div class="card">
            <h2>Check Details</h2>

            <div class="field">
                <label for="checkTo">Check Made Out To <span class="req">*</span></label>
                <input type="text" id="checkTo" name="checkTo">
            </div>

            <div class="field">
                <label for="checkMemo">Check Memo</label>
                <input type="text" id="checkMemo" name="checkMemo">
            </div>

            <div class="field">
                <label>How should the check be handled? <span class="req">*</span></label>
                <div class="radio-group">
                    <label><input type="radio" name="mailed" value="No" checked> Pick up at the library</label>
                    <label><input type="radio" name="mailed" value="Yes"> Mail to vendor</label>
                </div>
                <div id="mailWrap" class="hidden">
                    <label for="mailAddress" style="margin-top:12px;">Vendor name and address</label>
                    <textarea id="mailAddress" name="mailAddress" placeholder="Name&#10;Street&#10;City, State ZIP"></textarea>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Receipts &amp; Attachments</h2>
            <div class="drop-zone" id="dropZone" role="button" tabindex="0"
                 aria-label="Add receipts. Drop images or PDFs here, or activate to select files.">
                <div class="drop-icon">📎</div>
                <div class="drop-text">Drop images or PDFs here</div>
                <div class="drop-hint">or click to select files &middot; multiple allowed</div>
            </div>
            <input type="file" class="file-input" id="fileInput" accept="image/*,application/pdf" multiple>
            <ul class="file-list" id="fileList"></ul>
        </div>

        <button type="submit" class="generate-btn" id="generateBtn">Generate Reimbursement PDF</button>

        <div class="status-message" id="statusMessage"></div>
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="reimbursement.js"></script>
</body>
</html>
